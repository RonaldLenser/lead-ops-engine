# Alembic config. No database URL is stored here: migrations/env.py reads
# MIGRATION_DATABASE_URL (or DATABASE_URL) through the app's Settings, so no
# credentials ever live in a committed file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
# Revision files are named by their explicit ID: 0001_baseline.py, 0002_..., in order.
file_template = %%(rev)s_%%(slug)s
path_separator = os

# Logging is configured in migrations/env.py with the app's structured logging,
# so there are no [loggers] sections here.
